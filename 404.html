<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | Luina Apps Studio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23143d2b'/%3E%3Cpath d='M68 50A22 22 0 1 1 42 28a25 25 0 0 0 26 22z' fill='%23eab308'/%3E%3Ccircle cx='68' cy='32' r='4.5' fill='%2310b981'/%3E%3C/svg%3E">
    <style>
        :root {
            --emerald-dark: #143d2b;
            --emerald-bright: #10b981;
            --gold-accent: #eab308;
            --glass-bg: rgba(255, 255, 255, 0.86);
            --glass-border: rgba(255, 255, 255, 0.95);
            --text-main: #1d1d1f;
            --text-secondary: #515154;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f6f8fb;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .liquid-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            filter: blur(65px);
            opacity: 0.8;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            animation: floatBlob 10s infinite alternate ease-in-out;
        }

        .blob-1 { width: 420px; height: 420px; background: rgba(16, 185, 129, 0.22); top: -100px; left: -80px; }
        .blob-2 { width: 480px; height: 480px; background: rgba(0, 122, 255, 0.16); bottom: -140px; right: -100px; animation-delay: -3s; }
        .blob-3 { width: 320px; height: 320px; background: rgba(234, 179, 8, 0.16); top: 40%; left: 30%; animation-delay: -5s; }

        @keyframes floatBlob {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(50px, 40px, 0) scale(1.12); }
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 34px;
            padding: 48px 32px;
            max-width: 540px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 60px rgba(20, 61, 43, 0.1);
            animation: popIn 0.55s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
        }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(28px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .icon-badge {
            width: 68px;
            height: 68px;
            margin: 0 auto 18px auto;
            border-radius: 22px;
            background: linear-gradient(135deg, #143d2b, #059669);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 28px rgba(20, 61, 43, 0.24);
        }

        .code {
            font-size: clamp(68px, 14vw, 108px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -3px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #143d2b, #10b981, #eab308);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--emerald-dark);
            margin-bottom: 10px;
        }

        p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .path-pill {
            display: inline-block;
            background: rgba(20, 61, 43, 0.07);
            color: var(--emerald-dark);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12.5px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 50px;
            margin-bottom: 24px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .btn-primary, .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 26px;
            border-radius: 50px;
            font-size: 14.5px;
            font-weight: 800;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #143d2b, #059669);
            color: #ffffff;
            box-shadow: 0 10px 24px rgba(20, 61, 43, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(16, 185, 129, 0.35);
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--emerald-dark);
            border: 1px solid rgba(20, 61, 43, 0.14);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            background: #f0fdf4;
        }

        .brand {
            margin-top: 26px;
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="card">
        <div class="icon-badge" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
            </svg>
        </div>

        <div class="code">404</div>
        <h1>Aradığın Sayfa Bulunamadı</h1>
        <div class="path-pill" id="missingPath">/</div>
        <p>Bağlantı yanlış yazılmış veya sayfa taşınmış olabilir. Ana sayfaya dönüp Aynur'u incelemeye devam edebilirsin.</p>

        <div class="actions">
            <a href="/" class="btn-primary">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Ana Sayfaya Dön
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.aynuremir.app" class="btn-secondary" target="_blank" rel="noopener noreferrer">
                Aynur'u İndir
            </a>
        </div>

        <div class="brand">Luina Apps Studio</div>
    </main>

    <script>
        const pathEl = document.getElementById('missingPath');
        pathEl.textContent = decodeURIComponent(window.location.pathname || '/');
    </script>
</body>
</html>
